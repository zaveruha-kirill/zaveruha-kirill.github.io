<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK OAuth — код получен</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0a09; color: #f0ebe6;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 640px; width: 100%;
    background: #161412; border: 1px solid rgba(196,118,58,0.2);
    border-radius: 16px; padding: 40px;
  }
  h1 { font-size: 22px; margin-bottom: 12px; }
  p  { color: #8a8380; font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
  textarea {
    width: 100%; height: 110px; resize: none;
    background: #0b0a09; color: #f0ebe6;
    border: 1px solid rgba(196,118,58,0.3); border-radius: 8px;
    padding: 12px; font-family: monospace; font-size: 12px;
  }
  button {
    margin-top: 16px; width: 100%;
    background: #c4763a; color: #f0ebe6; border: none;
    padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity .2s;
  }
  button:hover { opacity: 0.85; }
  .ok { color: #4ade80; margin-top: 12px; font-size: 14px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>✅ Авторизация VK прошла</h1>
  <p>Скопируй адрес ниже и вставь его в консоль, где запущен
     <code>setup_vk_oauth.py</code>. Эту вкладку потом можно закрыть.</p>
  <textarea id="url" readonly></textarea>
  <button id="copy">Скопировать адрес</button>
  <div class="ok" id="done">Скопировано — вставь в консоль</div>
</div>
<script>
  // Показываем полный URL с code/state/device_id из адресной строки
  var field = document.getElementById('url');
  field.value = location.href;
  document.getElementById('copy').addEventListener('click', function () {
    field.select();
    navigator.clipboard.writeText(field.value).then(function () {
      document.getElementById('done').style.display = 'block';
    });
  });
</script>
</body>
</html>
